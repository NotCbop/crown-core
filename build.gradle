plugins {
	id 'java'
	id 'idea'
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url 'https://repo.spongepowered.org/maven' }
	mavenCentral()
}

loom {
	mods {
		"${modid}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Pure-Java H.264 decoder for the loading screen's background clips (no native libs, ~1 MB).
	// Jar-in-jar'd so players don't need anything extra.
	implementation "org.jcodec:jcodec:0.2.5"
	include "org.jcodec:jcodec:0.2.5"
}

base {
	archivesName = project.archives_base_name
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.5 (24w14a) upwards uses Java 21.
	it.options.release = 21
	it.options.compilerArgs += ['-Xmaxerrs', '2000', '-Xmaxwarns', '2000']
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
